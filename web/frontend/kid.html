<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鲸灵学园 · 学习空间</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#072a4a,#0e5a8f 55%,#1490c8); color:#eaf6ff;
    padding:16px 14px 90px; font-size:18px; }
  button { font-family:inherit; }
  /* 顶栏 */
  #top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  #who { display:flex; align-items:center; gap:10px; }
  #who .avatar { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:24px; }
  #who .name { font-size:19px; font-weight:bold; }
  #who .title-chip { font-size:12px; color:#ffd39e; }
  #topRight { display:flex; align-items:center; gap:8px; }
  #topRight button { background:rgba(255,255,255,.16); border:none; color:#fff; font-size:17px;
    width:44px; height:44px; border-radius:12px; cursor:pointer; }
  .card { background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
    border-radius:16px; padding:16px; margin-bottom:14px; }
  .card h3 { font-size:16px; color:#bfe4ff; margin-bottom:10px; font-weight:normal; }
  /* 课程地图 */
  .unit { margin-bottom:12px; }
  .unit .uname { font-size:17px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }

    flex-direction:column; justify-content:center; gap:2px; }
  .lvl .lv-name { font-weight:bold; }
  .lvl .lv-status { font-size:12px; color:#bfe4ff; }
  .lvl.done { border-color:#7be3a2; }

  .lvl.planned { opacity:.45; cursor:not-allowed; }
  /* 每日挑战 */
  #dailyCard .go { min-height:56px; width:100%; border:none; border-radius:14px; font-size:17px;
    font-weight:bold; background:#ffd39e; color:#5a3b12; cursor:pointer; }
  #dailyCard .go:disabled { opacity:.5; }
  /* 答题面板 */
  #play { display:none; }
  #qPrompt { font-size:20px; line-height:1.6; margin:12px 0; color:#fff; min-height:64px; }
  #qTier { font-size:12px; color:#ffd39e; }
  #answer { width:100%; min-height:56px; font-size:22px; border-radius:14px; border:none;
    padding:10px 16px; outline:none; background:rgba(255,255,255,.92); color:#123; }
  #submit { width:100%; min-height:56px; margin-top:12px; border:none; border-radius:14px;
    font-size:18px; font-weight:bold; background:#0b3d66; color:#fff; cursor:pointer; }
  #submit:disabled { opacity:.5; }
  #feedback { min-height:54px; margin-top:10px; font-size:16px; line-height:1.5; }
  #feedback.ok { color:#7be3a2; }
  #feedback.no { color:#ffb0b0; }
  #scaffold { display:none; background:rgba(255,211,158,.15); border-left:4px solid #ffd39e;
    padding:10px 12px; border-radius:10px; margin-top:8px; font-size:16px; line-height:1.5; }
  #progress { font-size:13px; color:#bfe4ff; margin-top:6px; }
  /* 课外馆 */
  .games { display:flex; gap:10px; flex-wrap:wrap; }
  .games .g { min-height:56px; flex:1 1 44%; background:rgba(255,255,255,.14); border:none;
    border-radius:14px; color:#fff; font-size:16px; cursor:pointer; padding:10px; }
  .games .g:active { transform:scale(.96); }
  /* 同伴栏 */
  #companion { position:fixed; left:0; right:0; bottom:0; background:rgba(7,42,74,.95);
    backdrop-filter:blur(6px); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:12px; align-items:center; z-index:50; }
  #companion .cav { width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-size:28px; flex:none; }
  #bubble { flex:1; background:#fff; color:#1c3a52; border-radius:14px; padding:10px 14px;
    font-size:16px; line-height:1.5; min-height:40px; }
  /* 遮罩(休息/总结) */
  #overlay { position:fixed; inset:0; background:rgba(4,20,38,.92); z-index:100; display:none;
    align-items:center; justify-content:center; padding:24px; }
  #overlay .panel { max-width:520px; width:100%; background:rgba(255,255,255,.1);
    border-radius:18px; padding:24px; text-align:center; }
  #overlay h2 { font-size:22px; margin-bottom:14px; }
  #overlay p { font-size:17px; line-height:1.7; margin-bottom:10px; }
  #overlay .done-btn { min-height:56px; width:100%; border:none; border-radius:14px;
    font-size:17px; font-weight:bold; background:#ffd39e; color:#5a3b12; cursor:pointer; margin-top:10px; }
  .back { background:none; border:none; color:#bfe4ff; font-size:16px; cursor:pointer;
    padding:8px 0; margin-bottom:6px; }
</style>
</head>
<body>
  <div id="top">
    <div id="who">

<script>
"use strict";
const CHILD = new URLSearchParams(location.search).get("child") || "ranran";
const $ = id => document.getElementById(id);
let muted = localStorage.getItem("wm_muted") === "1";
let curAudio = null, curSession = null, curQid = null, curLevel = null;

function bubble(t, ms = 6000) { $("bubble").textContent = t; clearTimeout(bubble._t); bubble._t = setTimeout(() => $("bubble").textContent = "", ms); }
function stopAudio() { if (curAudio) { curAudio.pause(); curAudio = null; } try { speechSynthesis.cancel(); } catch (_) {} }
async function playUrl(url) {
  if (muted) return true;
  try {
    const r = await fetch(url);
    if (!r.ok) return false;
    const b = await r.blob();
    stopAudio();
    curAudio = new Audio(URL.createObjectURL(b));
    curAudio.volume = Number(localStorage.getItem("wm_vol") ?? "1");
    await curAudio.play();
    return true;
  } catch (e) { return e && e.name === "NotAllowedError"; }
}
async function speak(text, emo) {
  if (muted) return;
  try {
    const q = new URLSearchParams({ text });
    if (emo) q.set("emo", emo);
    const r = await fetch("/api/tts?" + q.toString());
    if (!r.ok) throw 0;
    const b = await r.blob();
    stopAudio();
    curAudio = new Audio(URL.createObjectURL(b));
    await curAudio.play();
  } catch (_) {
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "zh-CN"; speechSynthesis.speak(u); } catch (_) {}
  }
}
$("muteBtn").textContent = muted ? "🔇" : "🔊";
$("muteBtn").addEventListener("click", () => {
  muted = !muted;
  localStorage.setItem("wm_muted", muted ? "1" : "0");
  $("muteBtn").textContent = muted ? "🔇" : "🔊";
  if (muted) stopAudio();
});

/* 顶栏身份 */
fetch("/api/profiles").then(r => r.json()).then(({ children }) => {
  const me = children.find(c => c.id === CHILD);
  if (me) { $("whoName").textContent = me.name; $("whoAvatar").textContent = me.avatar === "whale" ? "🐋" : "🐟"; }
}).catch(() => {});

/* R134 重练模式状态 */
let redoState = null;
function showRedoQ() {
  const q = redoState.list[redoState.i];
  const ov = $("overlay");
  ov.style.display = "flex";
  $("overlayBody").innerHTML = `<h2>🔁 错题重练 ${redoState.i + 1}/${redoState.list.length}</h2>
    <p style="font-size:13px;color:#9fc6e8">上次做错了,再试一次</p>
    <p style="font-size:22px;font-weight:bold">${q.prompt}</p>
    <input id="redoAns" inputmode="decimal" autocomplete="off" placeholder="输入答案"
      style="width:100%;min-height:56px;font-size:20px;border-radius:12px;border:none;padding:10px 16px;margin-top:8px">
    <button class="done-btn" id="redoGo">提交</button>
    <p id="redoFb" style="min-height:24px"></p>`;
  $("redoAns").focus();
  $("redoGo").onclick = () => submitRedo();
  $("redoAns").addEventListener("keydown", ev => { if (ev.key === "Enter") $("redoGo").click(); });
}
async function submitRedo() {
  const val = $("redoAns").value.trim();
  if (!val) return;
  const r = await fetch("/api/learn/answer", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ child: CHILD, session: redoState.session, qid: q.qid || redoState.list[redoState.i].qid, answer: val, time_s: 0 })
  }).catch(() => null);
  if (!r || !r.ok) { $("redoFb").textContent = "提交失败,稍后再试。"; return; }
  const d = await r.json();
  if (d.correct) {
    redoState.right++;
    $("redoFb").textContent = "✓ 这次对了!";
    spawnParticles("hearts", innerWidth / 2, innerHeight / 2);
    // R141 学而思对标「举一反三」:答对后追加一道同知识点新题
    if (redoState.appended === undefined) redoState.appended = 0;
    if (redoState.appended < 2) {
      try {
        const cur = redoState.list[redoState.i];
        const nq = await (await fetch(`/api/learn/next?child=${encodeURIComponent(CHILD)}&level=${cur.level}&session=redo-extra-${Date.now()}`)).json();
        if (nq.qid && !redoState.list.some(x => x.qid === nq.qid)) {
          redoState.list.push(nq);
          redoState.appended++;
        }
      } catch (_) {}
    }
  } else {
    $("redoFb").textContent = "还差一点,看看提示:" + (d.scaffold || "");
  }
  setTimeout(() => {
    redoState.i++;
    if (redoState.i < redoState.list.length) showRedoQ();
    else {
      $("overlayBody").innerHTML = `<h2>重练完成 ✓</h2>
        <p>答对 ${redoState.right}/${redoState.list.length},XP 已累计。</p>
        <button class="done-btn" onclick="closeOverlay();loadMap()">回地图</button>`;
    }
  }, 900);
}

/* R54 成就墙 */
async function loadAchv() {
  const el = $("achv");
  try {
    const d = await (await fetch("/api/learn/achievements?child=" + encodeURIComponent(CHILD))).json();
    const wb = document.getElementById("whoBadges");
    if (wb) wb.textContent = d.badges.length;
    const ws = document.getElementById("whoStreak");
    if (ws) ws.textContent = d.streak_days;
    const rows = [];
    rows.push(`<div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px">
      <span>🔥</span><span style="flex:1;font-size:15px">连续学习</span>
      <span style="font-size:13px;color:#ffd39e">${d.streak_days} 天 · 每日挑战连击 ${d.daily_streak} 天</span></div>`);
    rows.push(`<div style="display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px">
      <span>📚</span><span style="flex:1;font-size:15px">累计作答</span>
      <span style="font-size:13px;color:#ffd39e">${d.total_answers} 题 · 错题还剩 ${d.wrong_left}</span></div>`);
    d.badge_dates = d.badge_dates || {};
    d.badges.forEach(b => {
      const dt = (d.badge_dates || {})[b] ? ` · ${d.badge_dates[b]}` : "";
      rows.push(`<div style="display:flex;gap:10px;align-items:center;background:rgba(255,211,158,.18);border:1px solid #ffd39e;border-radius:12px;padding:8px 12px">
      <span>🏅</span><span style="flex:1;font-size:15px">${b}</span><span style="font-size:11px;color:#9fc6e8">${dt}</span></div>`);
    });
    el.innerHTML = rows.join("");
  } catch (_) { el.innerHTML = '<div style="opacity:.6;font-size:13px">成就墙加载失败</div>'; }
}

/* R61/R62 英语角:每日 3 词,EN 童声三件套 */
$("englishBtn").addEventListener("click", async () => {
  pokeOff();
  try {
    const d = await (await fetch("/api/learn/words/daily?child=" + encodeURIComponent(CHILD))).json();
    for (const w of d.words) {
      bubble(`🔤 ${w.word} = ${w.zh}`, 20000);
      setEmoSafe("normal");
      if (!(await playUrl(`/egg-audio/word_${w.word}_en.mp3`))) await speak(w.word);
      if (!(await playUrl(`/egg-audio/word_${w.word}_zh.mp3`))) await speak(w.zh);
      if (!(await playUrl(`/egg-audio/word_${w.word}_sent.mp3`))) await speak(w.sentence);
    }
    bubble("今天的单词学完啦!接下来试着跟读一遍?");
    await readPractice("en");
    return;
  } catch (_) { bubble("英语角被海浪挡了一下,再试一次。"); }
});

/* R124 看拼音写词(洪恩识字对标):看拼音→输入汉字→即时判分 */
let pyState = null;
$("pinyinBtn").addEventListener("click", async () => {
  pokeOff();
  try {
    const d = await (await fetch("/api/learn/chinese/daily?child=" + encodeURIComponent(CHILD))).json();
    pyState = { list: d.words, i: 0, right: 0 };
    showPinyin();
  } catch (_) { bubble("拼音写词被海浪挡了一下,再试一次。"); }
});
function showPinyin() {
  const w = pyState.list[pyState.i];
  const ov = $("overlay");
  ov.style.display = "flex";
  $("overlayBody").innerHTML = `<h2>📝 看拼音写词 ${pyState.i + 1}/${pyState.list.length}</h2>
    <p style="font-size:34px;font-weight:bold;letter-spacing:6px;color:#ffd39e">${w.pinyin}</p>
    <input id="pyAns" autocomplete="off" placeholder="写出这个词语" style="width:100%;min-height:56px;font-size:20px;text-align:center;border:none;border-radius:12px">
    <p id="pyFb" style="min-height:26px"></p>
    <button class="done-btn" id="pyGo">提交</button>`;
  $("pyAns").focus();
  $("pyGo").onclick = () => {
    const ok = normWord($("pyAns").value) === normWord(w.word);
    if (ok) {
      pyState.right++;
      $("pyFb").textContent = "✓ 正确!" + w.word;
      spawnParticles("hearts", innerWidth / 2, innerHeight / 2.2);
    } else {
      $("pyFb").textContent = "正确是:" + w.word + " —— 再试试下一个。";
    }
    $("pyGo").disabled = true;
    setTimeout(() => {
      pyState.i++;
      if (pyState.i < pyState.list.length) showPinyin();
      else {
        $("overlayBody").innerHTML = `<h2>拼音写词完成 ✓</h2>
          <p>答对 ${pyState.right}/${pyState.list.length}。</p>
          <button class="done-btn" onclick="closeOverlay();loadMap()">好的</button>`;
      }
    }, 1100);
  };
  $("pyAns").addEventListener("keydown", ev => { if (ev.key === "Enter") $("pyGo").click(); });
}

/* R103 语文角:每日 3 词跟读(词+课文句,预生成音频) */
$("chineseBtn").addEventListener("click", async () => {
  pokeOff();
  try {
    const d = await (await fetch("/api/learn/chinese/daily?child=" + encodeURIComponent(CHILD))).json();
    for (const w of d.words) {
      bubble(`📖 ${w.word}(${w.pinyin || ""})`, 15000);
      if (!(await playUrl(`/egg-audio/chinese_${w.word}.mp3`))) await speak(w.word);
      if (!(await playUrl(`/egg-audio/chinese_${w.word}_sent.mp3`))) await speak(w.sentence);
    }
    bubble("今天的词语读完啦!试着用它们造个句子吧。");
  } catch (_) { bubble("语文角被海浪挡了一下,再试一次。"); }
});

/* R106 跟读练习(洪恩式口语反馈):听词→跟读→即时判分 */
let readList = null, readIdx = 0;
function normWord(s) {
  return String(s).toLowerCase().replace(/[\s.,!?。,!?;、·'"-]/g, "");
}
function matchWord(transcript, target) {
  const norm = s => normWord(s);
  const t = norm(transcript), g = norm(target);
  if (!t || !g) return false;
  return t.includes(g) || g.includes(t);
}
async function readPractice(mode) {
  pokeOff();
  try {
    if (mode === "en") {
      const d = await (await fetch("/api/learn/words/daily?child=" + encodeURIComponent(CHILD))).json();
      readList = { words: d.words.map(w => ({ word: w.word })) };
      readLang = "en-US";
    } else {
      readList = await (await fetch("/api/learn/chinese/daily?child=" + encodeURIComponent(CHILD))).json();
      readLang = "zh-CN";
    }
    readIdx = 0;
    const ov = $("overlay");
    ov.style.display = "flex";
    $("overlayBody").innerHTML = `<h2>🎤 跟读练习</h2><p id="rpWord" style="font-size:24px;font-weight:bold"></p>
      <p id="rpFb" style="min-height:28px"></p>
      <button class="done-btn" id="rpMic">开始跟读</button>
      <button class="done-btn" style="background:#0e5a8f" onclick="closeOverlay();loadMap()">完成练习</button>`;
    showReadWord();
  } catch (_) { bubble("跟读练习被海浪挡了一下,再试一次。"); }
}
function showReadWord() {
  const w = readList.words[readIdx];
  $("rpWord").textContent = w.word;
  $("rpFb").textContent = "点「开始跟读」,大声读出来!";
  const audio = readLang === "en-US"
    ? "/egg-audio/word_" + w.word + "_en.mp3"
    : "/egg-audio/chinese_" + w.word + ".mp3";
  playUrl(audio).then(ok => { if (!ok) speak(w.word); });
  $("rpMic").onclick = () => listenRead(w.word);
}
function listenRead(target) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("rpFb").textContent = "这台浏览器听不见声音,照着屏幕读就好!"; return; }
  const rec = new SR();
  rec.lang = readLang || "zh-CN"; rec.interimResults = false; rec.maxAlternatives = 3;
  $("rpFb").textContent = "我在听,请读…";
  rec.onresult = e => {
    const exact = Array.from(e.results[0]).some(r => norm(r.transcript) === norm(target));
    const ok = Array.from(e.results[0]).some(r => matchWord(r.transcript, target));
    if (exact) {
      $("rpFb").textContent = "完美!发音和书本一模一样!✨✨";
      spawnParticles("hearts", innerWidth / 2, innerHeight / 2);
    } else if (ok) {
      $("rpFb").textContent = "读对了!再来一遍会更熟练。";
    } else {
      const said = e.results[0][0].transcript;
      $("rpFb").textContent = "再读一遍,慢一点、声音大一点。(听到的是:" + said + ")";
    }
  };
  rec.onerror = () => { $("rpFb").textContent = "没听清,再试一次。"; };
  rec.start();
}
$("readBtn").addEventListener("click", readPractice);

/* 课程地图 */
async function loadMap() {
  const m = await (await fetch("/api/learn/map?child=" + encodeURIComponent(CHILD))).json();
  $("whoTitle").textContent = m.title;
  $("whoXp").textContent = m.xp;
  const map = $("map");
  map.innerHTML = "";
  m.units.forEach(u => {
    const div = document.createElement("div");
    div.className = "unit";
    div.innerHTML = `<div class="uname">${u.planned ? "🔒" : "📘"} ${u.name}${u.total_n ? ` · 已完成 ${u.done_n}/${u.total_n}` : ""}${u.unlocked === false && !u.planned ? " 🔒 完成上一单元解锁" : ""}</div>`;
    div.dataset.unlocked = u.unlocked === false ? "0" : "1";
    const lv = document.createElement("div");
    lv.className = "lvls";
    (u.levels || []).forEach(l => {
      const b = document.createElement("div");
      const locked = u.unlocked === false && !u.planned;
      b.className = "lvl" + (l.done ? " done" : "") + (locked ? " planned" : "");
      const wrongNote = l.wrong ? ` · 错过 ${l.wrong} 次` : "";
      const starNote = l.stars ? "⭐".repeat(l.stars) : "";
      b.innerHTML = `<div class="lv-name">${l.name}</div><div class="lv-status">${l.done ? (starNote + " · 最佳连对 " + l.best + wrongNote) : l.count + " 题 · 可挑战" + wrongNote}</div>`;
      if (!locked) b.addEventListener("click", () => startLevel(l.id, l.name));
      lv.appendChild(b);
    });
    if (u.planned) { const p = document.createElement("div"); p.className = "lv-status"; p.textContent = "建设中,后续开放"; lv.appendChild(p); }
    div.appendChild(lv);
    map.appendChild(div);
  });
  // R58 自适应推荐:第一个已解锁且未通关的关卡
  const rec = map.querySelector('[data-unlocked="1"] .lvl:not(.done)');
  if (rec) rec.innerHTML = "⭐ " + rec.innerHTML;
  fetch("/api/learn/daily?child=" + encodeURIComponent(CHILD)).then(r => r.json()).then(d => {
    $("dailyGo").textContent = d.done ? "今天已完成 ✓(明天再来)" : (d.review ? "开始今天的挑战(含 1 题错题复习)" : "开始今天的挑战");
    $("dailyGo").disabled = d.done;
  }).catch(() => {});
  // R59 错题本剩余数显示在按钮上
  fetch("/api/learn/wrongbook?child=" + encodeURIComponent(CHILD)).then(r => r.json()).then(d => {
    $("wrongbookBtn").textContent = `📕 错题本(${d.items.length})`;
  }).catch(() => {});
}
loadMap(); loadTree(); loadAchv(); loadToday(); loadToday();

/* 关卡玩法(自适应) */
async function startLevel(levelId, levelName) {
  curLevel = levelId;
  curSession = "s-" + Date.now();
  fetch("/api/learn/current", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ child: CHILD, level: levelId }) }).catch(() => {});
  $("home").style.display = "none";
  $("play").style.display = "block";
  $("progress").textContent = ` · ${levelName}`;
  bubble("关卡开始。答错没关系,提示会告诉你下一步往哪想。");
  await nextQuestion();
}
async function nextQuestion() {
  let q;
  try {
    q = await (await fetch(`/api/learn/next?child=${encodeURIComponent(CHILD)}&level=${curLevel}&session=${curSession}`)).json();
  } catch (e) {
    bubble("网络好像断了——你的进度已经保存,联网后回来继续。");
    return;
  }
  if (q.detail && String(q.detail).includes("session expired")) {
    curSession = "s-" + Date.now();  // R20: 服务重启后会话失效 → 自动开新会话
    return nextQuestion();
  }
  curQid = q.qid;
  $("qTier").textContent = "难度:" + q.tier_cn;
  $("qPrompt").textContent = q.prompt;
  $("answer").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "";
  $("scaffold").style.display = "none";
  $("submit").disabled = false;
  updateProgress(q.count, q.total);
  $("answer").focus();
}
function updateProgress(count, total) {
  $("progress").textContent = $("progress").textContent.replace(/ · \d+\/\d+/, "") + ` · ${count}/${total}`;
}
$("submit").addEventListener("click", submitAnswer);
/* R116 语音作答:按住说答案(数字),识别结果填入输入框 */
$("voiceAns").addEventListener("click", () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("feedback").textContent = "这台浏览器听不见声音,请手动输入。"; return; }
  try {
    const rec = new SR();
    rec.lang = "zh-CN"; rec.interimResults = false;
    $("feedback").className = "no";
    $("feedback").textContent = "我在听,请说出答案…";
    rec.onresult = e => {
      const said = e.results[0][0].transcript;
      const m = said.match(/\d+/);
      if (m) { $("answer").value = m[0]; $("feedback").textContent = "听到:" + said; }
      else $("feedback").textContent = "没听到数字,再试一次或手动输入。";
    };
    rec.start();
  } catch (_) { $("feedback").textContent = "语音作答不可用,请手动输入。"; }
});
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") submitAnswer(); });
async function submitAnswer() {
  const text = $("answer").value.trim();
  if (!text) { $("feedback").textContent = "先写上你的答案。"; $("feedback").className = "no"; return; }
  $("submit").disabled = true;
  const r = await (await fetch("/api/learn/answer", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ child: CHILD, session: curSession, qid: curQid, answer: text, time_s: 5 })
  })).json();
  if (r.correct) {
    $("feedback").className = "ok";
    $("feedback").textContent = `答对了 +${r.xp_gain} XP`;
    $("scaffold").style.display = "none";
    bubble(["思路稳。", "对,这个关系你吃透了。", "漂亮,继续。"][Math.floor(Math.random() * 3)]);
    if (r.tier_change) bubble(`难度升到「${r.tier_change.to === "challenge" ? "挑战" : "标准"}」档——你连对了。`);
    await speak("答对了", "happy");
  } else {
    $("feedback").className = "no";
    if (r.step_hint) $("feedback").textContent = "还没对。这次按「中间步骤」的写法,一步一步来。";
    else $("feedback").textContent = r.retry ? "没对,但差得不远——看提示,换个角度再试一次。" : "这两步先放过,换个题继续走。";
    $("scaffold").textContent = "💡 " + (r.step_hint || r.scaffold || "");
    $("scaffold").style.display = "block";
    if (r.prereq) bubble(`先修点:${r.prereq.name}(${r.prereq.chapter})——先做它的诊断题再回来。`);
    else bubble("提示在下方。先按提示的路径走一步。");
    await speak(r.prereq ? `先复习一下${r.prereq.name}` : "看一下提示,换个角度再试。");
  }
  updateProgress(r.count, r.total);
  if (r.done) { showSummary(r); return; }
  if (r.retry) { $("submit").disabled = false; $("answer").select(); return; }
  if (r.next) { curQid = r.next.qid; $("qTier").textContent = "难度:" + r.next.tier_cn; $("qPrompt").textContent = r.next.prompt; $("answer").value = ""; $("feedback").textContent = ""; $("scaffold").style.display = "none"; $("submit").disabled = false; $("answer").focus(); return; }
  setTimeout(async () => { $("play").style.display = "none"; $("home").style.display = "block"; loadMap(); }, 1400);
}
function showSummary(r) {
  const s = r.summary || {};
  const starLine = r.stars ? `<p>${"⭐".repeat(r.stars)}(${r.stars} 星)</p>` : "";
  const badgeLine = (r.badges && r.badges.length)
    ? `<p>🏅 研究笔记:你解锁了「${r.badges.join("」「")}」</p>` : "";
  $("overlay").style.display = "flex";
  $("overlayBody").innerHTML = `<h2>本关完成 ✓</h2>
    ${starLine}
    <p>最佳连对:${s.streak ?? 0}</p>
    <p>当前称号:${s.title ?? "–"}</p>
    ${badgeLine}
    <p>错过的题已经记进档案,家长端能看到建议。</p>
    <button class="done-btn" onclick="closeOverlay()">回地图</button>`;
  $("play").style.display = "none";
  $("home").style.display = "block";
  loadMap(); loadTree(); loadAchv(); loadToday(); loadToday(); loadWrongbook();
}
function closeOverlay() { $("overlay").style.display = "none"; }

/* 每日挑战:逐题真作答(双倍 XP 由后端按 daily 会话计) */
let dailyState = null;
$("dailyGo").addEventListener("click", async () => {
  const d = await (await fetch("/api/learn/daily?child=" + encodeURIComponent(CHILD))).json();
  if (d.done) return;
  dailyState = { list: d.questions, i: 0, right: 0, session: "daily-" + Date.now() };
  showDailyQ();
});
function showDailyQ() {
  const q = dailyState.list[dailyState.i];
  const ov = $("overlay");
  ov.style.display = "flex";
  $("overlayBody").innerHTML = `
    <h2>每日挑战 ${dailyState.i + 1}/${dailyState.list.length}</h2>
    <p style="font-size:13px;color:#9fc6e8">${q.kind === "review" ? "🔁 错题复习" : q.kind === "srs" ? "🔄 记忆巩固" : "✨ 新题"}</p>
    <p style="font-size:22px;font-weight:bold">${q.prompt}</p>
    <input id="dailyAns" inputmode="decimal" autocomplete="off" placeholder="输入答案"
      style="width:100%;min-height:56px;font-size:20px;border-radius:12px;border:none;padding:10px 16px;margin-top:8px">
    <button class="done-btn" id="dailySubmit">提交</button>
    <p id="dailyFb" style="min-height:24px"></p>`;
  $("dailyAns").focus();
  $("dailySubmit").addEventListener("click", submitDaily, { once: true });
  $("dailyAns").addEventListener("keydown", e => { if (e.key === "Enter") $("dailySubmit").click(); });
}
async function submitDaily() {
  const val = $("dailyAns").value.trim();
  if (!val) return;
  const q = dailyState.list[dailyState.i];
  const r = await (await fetch("/api/learn/answer", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ child: CHILD, session: dailyState.session, qid: q.qid, answer: val, time_s: 0 })
  })).json();
  if (r.correct) dailyState.right++;
  $("dailyFb").textContent = r.correct ? "对!+" + r.xp_gain + " XP" : "这题先放过,看结算。";
  $("dailySubmit").disabled = true;
  setTimeout(() => {
    dailyState.i++;
    if (dailyState.i < dailyState.list.length) showDailyQ();
    else {
      $("overlayBody").innerHTML = `<h2>今日挑战完成 ✓</h2>
        <p>3 题答对 ${dailyState.right} 题,奖励已按双倍记入 XP。</p>
        <p>明天会有新的 3 题。</p>
        <button class="done-btn" onclick="closeOverlay();loadMap()">好的</button>`;
      $("dailyGo").textContent = "今天已完成 ✓(明天再来)";
      $("dailyGo").disabled = true;
    }
  }, 900);
}

/* 课外馆(走对话路由) */
async function sayToWhale(text) {
  pokeOff();
  const r = await (await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, session_id: "kid-" + CHILD, mode: "child" })
  })).json();
  bubble(r.reply);
  setEmoSafe(r.emo);
  await speak(r.reply, r.emo);
  if (r.song) { bubble("♪ 正在播放《" + (r.song_title || "歌") + "》"); await playUrl("/music-audio/" + r.song); }
  return r;
}
function setEmoSafe(emo) { /* 学园版仅用气泡+语音,不做立绘差分 */ }
document.querySelectorAll(".games .g").forEach(b =>
  b.addEventListener("click", () => sayToWhale(b.dataset.say).catch(() => bubble("这条线路被海浪挡了一下,再试一次。"))));

/* 防误触:学园版不需要发呆搭话 */
function pokeOff() {}

/* R20 边界:断网/恢复提示 */
window.addEventListener("offline", () => bubble("网络断了——别担心,你的进度已经保存。"));
window.addEventListener("online", () => { bubble("网络回来啦,继续!"); loadMap(); });

/* R30 错题本:列出近期错题,点题重做(force_qid 通道) */
$("wrongbookBtn").addEventListener("click", async () => {
  const box = $("wrongbook");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = '<div style="opacity:.7;font-size:14px">加载中…</div>';
  try {
    const d = await (await fetch("/api/learn/wrongbook?child=" + encodeURIComponent(CHILD))).json();
    const tierCN = { basic: "基础", standard: "标准", challenge: "挑战" };
    const orderT = { basic: 0, standard: 1, challenge: 2 };
    d.items.sort((a, b) => orderT[a.tier] - orderT[b.tier]);
    box.innerHTML = d.items.length
      ? d.items.map(i => `<div class="card" style="margin:8px 0;cursor:pointer" data-qid="${i.qid}" data-prompt="${i.prompt}" data-level="${i.level}">
            <b>【${tierCN[i.tier] || i.tier}】</b>${i.prompt}
            <div style="font-size:12px;color:#9fc6e8">${i.ts} · 点我重做</div></div>`).join("")
      : '<div style="opacity:.7;font-size:14px">错题本空空如也,太厉害了!</div>';
    box.querySelectorAll("[data-qid]").forEach(el =>
      el.addEventListener("click", () => redoWrong(el.dataset.qid, el.dataset.prompt, el.dataset.level)));
  } catch (_) { box.innerHTML = '<div style="opacity:.7;font-size:14px">加载失败,稍后再试。</div>'; }
}
function loadWrongbook() {
  const box = document.getElementById("wrongbook");
  if (box && box.style.display === "block") {
    box.innerHTML = '<div style="opacity:.7;font-size:14px">刷新中…</div>';
    fetch("/api/learn/wrongbook?child=" + encodeURIComponent(CHILD)).then(r => r.json()).then(d => {
      const tierCN = { basic: "基础", standard: "标准", challenge: "挑战" };
      const orderT = { basic: 0, standard: 1, challenge: 2 };
      d.items.sort((a, b) => orderT[a.tier] - orderT[b.tier]);
      // R129 按知识点分组(学而思式错题本)
      const byTopic = {};
      d.items.forEach(i => { (byTopic[i.topic] = byTopic[i.topic] || []).push(i); });
      // R134 一键重练按钮(≥2 题时显示)
      const redoAllBtn = d.items.length >= 2
        ? '<div style="margin:8px 0"><button class="done-btn" id="redoAll" style="width:100%;background:#7be3a2;color:#123">🔁 一键重练全部错题</button></div>' : "";
      box.innerHTML = (redoAllBtn || "") + (d.items.length
        ? Object.entries(byTopic).map(([topic, items]) =>
          `<div style="margin:10px 0"><div style="font-size:13px;color:#ffd39e;margin-bottom:4px">📚 ${topic}(${items.length} 题)</div>${items.map(i => `<div class="card" style="margin:8px 0;cursor:pointer" data-qid="${i.qid}" data-prompt="${i.prompt}" data-level="${i.level}">
            <b>【${tierCN[i.tier] || i.tier}】</b>${i.prompt}
            <div style="font-size:12px;color:#9fc6e8">${i.ts} · 点我重做</div></div>`).join("")}</div>`).join("")
        : '<div style="opacity:.7;font-size:14px">错题本空空如也,太厉害了!</div>');
      box.querySelectorAll("[data-qid]").forEach(el =>
        el.addEventListener("click", () => redoWrong(el.dataset.qid, el.dataset.prompt, el.dataset.level)));
      const redoAll = document.getElementById("redoAll");
      if (redoAll) redoAll.addEventListener("click", async () => {
        pokeOff();
        const r = await fetch("/api/learn/redo-session", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ child: CHILD }) });
        const d2 = await r.json();
        if (d2.empty) { bubble("没有错题需要重练。"); return; }
        redoState = { list: d2.questions, i: 0, session: d2.session, right: 0 };
        const ov = $("overlay");
        ov.style.display = "flex";
        showRedoQ();
      });
    }).catch(() => {});
  }
}
async function redoWrong(qid, prompt, level) {
  curLevel = level;
  curSession = "wb-" + Date.now();
  $("home").style.display = "none";
  $("play").style.display = "block";
  $("progress").textContent = " · 错题重做";
  $("qPrompt").textContent = prompt;
  $("qTier").textContent = "错题重做";
  $("answer").value = ""; $("feedback").textContent = ""; $("feedback").className = "";
  $("scaffold").style.display = "none";
  $("submit").disabled = false;
  $("answer").focus();
  await (await fetch(`/api/learn/next?child=${encodeURIComponent(CHILD)}&level=${curLevel}&session=${curSession}&force_qid=${qid}`)).json();
  curQid = qid;
}
