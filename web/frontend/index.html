<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鲸灵学园 · 谁来学习?</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#072a4a,#0e5a8f 55%,#1490c8);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#eaf6ff; padding:24px; gap:18px; }
  h1 { font-size:26px; letter-spacing:2px; }
  .sub { color:#9fc6e8; font-size:14px; }
  .cards { display:flex; gap:22px; flex-wrap:wrap; justify-content:center; margin-top:12px; }
  .card { width:220px; background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.25);
    border-radius:20px; padding:22px 18px; text-align:center; cursor:pointer; transition:.2s; }
  .card:active { transform:scale(.96); }
  .card .avatar { font-size:52px; }
  .card h2 { font-size:20px; margin:10px 0 4px; color:#fff; }
  .card p { font-size:13px; color:#bfe4ff; }
  .card.locked { opacity:.75; border-style:dashed; cursor:not-allowed; }
  .card .badge { display:inline-block; background:#ffd39e; color:#7a2d43; font-size:12px;
    padding:3px 10px; border-radius:999px; margin-top:8px; font-weight:bold; }
  .locked-note { display:none; margin-top:10px; background:rgba(0,0,0,.3); border-radius:10px;
    padding:8px; font-size:13px; }
  .card.locked.shown .locked-note { display:block; }
  footer { margin-top:26px; font-size:12px; color:rgba(191,228,255,.55); }
  footer a { color:rgba(191,228,255,.75); text-decoration:none; }
</style>
</head>
<body>
  <h1>小鲸灵学园</h1>
  <div class="sub">学习地图 · 每日挑战 · 研究档案 —— 选择你的档案</div>
  <div class="cards" id="cards"></div>
  <footer><a href="parent.html">家长入口</a></footer>
<script>
"use strict";
async function loadProfiles() {
  const wrap = document.getElementById("cards");
  try {
    const { children } = await (await fetch("/api/profiles")).json();
    wrap.innerHTML = "";
    children.forEach(c => {
      const div = document.createElement("div");
      div.className = "card" + (c.locked ? " locked" : "");
      div.innerHTML = `<div class="avatar">${c.avatar === "whale" ? "🐋" : "🐟"}</div>
        <h2>${c.name}</h2>
        <p>${c.locked ? c.age + " 岁 · 档案已建好" : c.age + " 岁 · 四年级下册"}</p>
        ${c.locked ? `<span class="badge">🔒</span><div class="locked-note">${c.lock_note}</div>` : `<span class="badge">进入学习</span>`}`;
      div.addEventListener("click", () => {
        if (c.locked) {
          div.classList.add("shown");
          return;
        }
        location.href = "kid.html?child=" + encodeURIComponent(c.id);
      });
      wrap.appendChild(div);
    });
  } catch (e) {
    wrap.innerHTML = '<div class="card"><h2>服务没连上</h2><p>请确认小鲸灵学园后端已启动</p></div>';
  }
}
loadProfiles();
</script>
</body>
</html>
