<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鲸灵 · 冉冉姐姐的小鲸鱼</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e5a8f">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#072a4a 0%,#0e5a8f 45%,#1490c8 100%);
    overflow:hidden; user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column;
  }
  /* ---- 背景气泡与海浪 ---- */
  .bubble { position:absolute; bottom:-70px; border-radius:50%;
    background:rgba(255,255,255,.13); animation:rise linear infinite; pointer-events:none; }
  @keyframes rise { to { transform:translateY(-120vh); opacity:0; } }
  .wave { position:fixed; left:-50%; width:200%; bottom:-24px; height:96px;
    background:rgba(255,255,255,.09); border-radius:45% 55% 0 0 / 70px 50px 0 0;
    animation:drift 11s ease-in-out infinite alternate; pointer-events:none; z-index:1; }
  .wave.w2 { bottom:-40px; height:80px; background:rgba(255,255,255,.13); animation-duration:16s; animation-direction:alternate-reverse; }
  @keyframes drift { from{transform:translateX(-4%)} to{transform:translateX(4%)} }

  /* ---- 粒子特效 ---- */
  .particle { position:fixed; z-index:60; pointer-events:none; animation:flyUp ease-out forwards; }
  @keyframes flyUp { to { transform:translate(var(--dx),-260px) rotate(var(--rot)); opacity:0; } }

  /* ---- 顶栏 ---- */
  #topbar { position:relative; z-index:5; display:flex; align-items:center;
    justify-content:space-between; padding:10px 12px; gap:8px; }
  #ctl { display:flex; gap:6px; }
  #ctl button { background:rgba(255,255,255,.16); border:none; color:#fff; font-size:16px;
    width:38px; height:38px; border-radius:50%; cursor:pointer; backdrop-filter:blur(4px); }
  #ctl button:active { transform:scale(.92); }
  #banner { display:none; background:linear-gradient(90deg,#ff9eb5,#ffd39e);
    color:#7a2d43; font-weight:bold; padding:8px 18px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.25); animation:pop .5s ease; white-space:nowrap; }
  #chip { background:rgba(255,255,255,.16); color:#eaf6ff; font-size:13px;
    padding:6px 12px; border-radius:999px; backdrop-filter:blur(4px); white-space:nowrap; }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }

  /* ---- 舞台 ---- */
  #stage { flex:1; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; z-index:2; }
  #speech { max-width:min(88vw,440px); background:#fff; color:#1c3a52;
    font-size:19px; line-height:1.55; padding:14px 20px; border-radius:20px;
    box-shadow:0 6px 18px rgba(0,0,0,.28); opacity:0; transform:translateY(12px) scale(.94);
    transition:.25s ease; position:relative; text-align:center; min-height:0;
    font-weight:500; }
  #speech.show { opacity:1; transform:translateY(0) scale(1); }
  #speech::after { content:""; position:absolute; left:50%; bottom:-10px;
    transform:translateX(-50%); border:10px solid transparent; border-top-color:#fff; border-bottom:0; }
  #whaleSvg { width:min(76vw,380px); height:auto; display:block; }
  #hint { color:#bfe4ff; font-size:14px; opacity:.85; }

  /* ---- 鲸鱼动画 ---- */
  #whaleG { animation:float 3.2s ease-in-out infinite; transform-origin:160px 150px; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  #tail { animation:sway 3.2s ease-in-out infinite; transform-origin:262px 160px; }
  @keyframes sway { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(9deg)} }
  #eyes { animation:blink 4.6s infinite; transform-origin:157px 142px; transform-box:view-box; }
  @keyframes blink { 0%,91%,100%{transform:scaleY(1)} 94%{transform:scaleY(.08)} 97%{transform:scaleY(1)} }
  #whaleG.wiggle { animation:wiggle .7s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg) translateY(-10px)} 60%{transform:rotate(4deg)} }
  #whaleG.squash { animation:squash .6s ease-in-out; }
  @keyframes squash { 0%,100%{transform:scale(1,1)} 40%{transform:scale(1.07,.9)} }
  .hot { cursor:pointer; }

  /* ---- 家长设置抽屉 ---- */
  #drawer { position:fixed; top:0; right:-340px; width:min(88vw,330px); height:100%;
    background:rgba(11,61,102,.96); color:#eaf6ff; z-index:80; transition:right .3s ease;
    padding:16px; overflow-y:auto; backdrop-filter:blur(6px); }
  #drawer.open { right:0; }
  #drawerOverlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:70; display:none; }
  #drawerOverlay.show { display:block; }
  .dhead { display:flex; justify-content:space-between; align-items:center; }
  .dhead h3 { font-size:17px; }
  #drawerClose { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; }
  .drow { display:flex; align-items:center; gap:10px; margin:14px 0; font-size:15px; }
  .drow input[type=range] { flex:1; accent-color:#ffd39e; }
  .drow select { flex:1; background:#0e5a8f; color:#fff; border:none; border-radius:10px; padding:9px; font-size:14px; }
  .drow .v { min-width:34px; text-align:right; color:#ffd39e; }
  .dbtn { width:100%; background:#ff7fa0; color:#fff; border:none; border-radius:12px;
    padding:11px; font-size:15px; cursor:pointer; margin:12px 0; }
  .dbtn:active { transform:scale(.97); }
  #drawer h4 { margin:18px 0 8px; font-size:14px; color:#bfe4ff; }
  #histList { max-height:42vh; overflow-y:auto; font-size:13px;
    display:flex; flex-direction:column; gap:6px; }
  #histList .muted { color:#9fc6e8; }
  .histItem { background:rgba(255,255,255,.08); border-radius:12px; padding:8px 10px;
    line-height:1.55; word-break:break-all; }
  .histItem .t { color:#9fc6e8; font-size:11px; margin-bottom:3px; }

  /* ---- 底部操作坞 ---- */
  #dock { position:relative; z-index:5; display:flex; flex-direction:column;
    align-items:center; gap:10px; padding:10px 12px calc(14px + env(safe-area-inset-bottom)); }
  #chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .chipbtn { background:rgba(255,255,255,.18); color:#fff; border:none; font-size:15px;
    padding:9px 15px; border-radius:999px; cursor:pointer; backdrop-filter:blur(4px); }
  .chipbtn:active { transform:scale(.94); }
  .chipbtn.util { background:rgba(255,255,255,.28); }
  #microw { display:flex; align-items:center; gap:10px; width:min(94vw,470px); }
  #hush { width:48px; height:48px; border-radius:50%; border:none; font-size:20px;
    background:rgba(255,255,255,.22); color:#fff; cursor:pointer; flex:none; }
  #hush:active { transform:scale(.9); }
  #mic { width:72px; height:72px; border-radius:50%; border:none; font-size:30px;
    background:#ffd39e; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3);
    flex:none; transition:.15s; position:relative; }
  #mic.rec { background:#ff7fa0; animation:pulse 1s infinite; }
  #mic.rec::before { content:""; position:absolute; inset:-9px; border-radius:50%;
    border:3px solid #ff7fa0; animation:ring 1.2s ease-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  @keyframes ring { from{transform:scale(.85);opacity:.9} to{transform:scale(1.45);opacity:0} }
  #inputrow { flex:1; display:flex; gap:8px; }
  #textbox { flex:1; border:none; border-radius:999px; padding:13px 18px; font-size:16px;
    outline:none; background:rgba(255,255,255,.92); min-width:0; }
  #send { border:none; border-radius:999px; padding:0 20px; font-size:16px; font-weight:bold;
    background:#0e5a8f; color:#fff; cursor:pointer; }
  #send:active { transform:scale(.94); }
</style>
</head>
<body>
  <div class="wave"></div>
  <div class="wave w2"></div>

  <div id="topbar">
    <div id="ctl">
      <button id="settings" title="家长设置(长按 2.5 秒)">⚙️</button>
      <button id="mute" title="声音开关">🔊</button>
      <button id="fs" title="全屏">⛶</button>
    </div>
    <div id="banner">🎂 冉冉姐姐,生日快乐!</div>
    <div id="chip">💬 台词模式</div>
  </div>

  <div id="stage">
    <div id="speech"></div>
    <svg id="whaleSvg" viewBox="0 0 340 270" aria-label="小鲸灵">
      <g id="whaleG">
        <g id="tail">
          <path d="M258 150 C292 128 318 132 330 118 C322 142 324 152 330 168 C314 158 292 162 262 172 Z" fill="#6cb6ea"/>
        </g>
        <ellipse cx="160" cy="155" rx="108" ry="76" fill="#7ec8f7"/>
        <ellipse cx="158" cy="198" rx="78" ry="42" fill="#cfeaff"/>
        <path d="M92 202 C114 228 154 230 178 216 C158 242 118 240 88 218 Z" fill="#6cb6ea"/>
        <path d="M92 100 Q160 48 228 100 L228 84 Q160 34 92 84 Z" fill="#ffffff"/>
        <circle cx="98" cy="88" r="9" fill="#ffffff"/>
        <circle cx="126" cy="72" r="9" fill="#ffffff"/>
        <circle cx="160" cy="66" r="9" fill="#ffffff"/>
        <circle cx="194" cy="72" r="9" fill="#ffffff"/>
        <circle cx="222" cy="88" r="9" fill="#ffffff"/>
        <path d="M70 84 L96 72 L96 92 Z" fill="#ff9eb5"/>
        <path d="M96 92 L122 84 L104 62 Z" fill="#ffb7c9"/>
        <circle cx="98" cy="82" r="6" fill="#ff7fa0"/>
        <g id="eyes">
          <circle cx="128" cy="142" r="14" fill="#26333f"/>
          <circle cx="186" cy="142" r="14" fill="#26333f"/>
          <circle cx="133" cy="137" r="5" fill="#ffffff"/>
          <circle cx="191" cy="137" r="5" fill="#ffffff"/>
        </g>
        <g id="eyesH" style="display:none">
          <path d="M114 145 Q128 129 142 145" stroke="#26333f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M172 145 Q186 129 200 145" stroke="#26333f" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <g id="eyesP" style="display:none">
          <g transform="translate(157 142) scale(1 .72) translate(-157 -142)">
            <circle cx="128" cy="142" r="13" fill="#26333f"/>
            <circle cx="186" cy="142" r="13" fill="#26333f"/>
            <circle cx="133" cy="138" r="4.5" fill="#ffffff"/>
            <circle cx="191" cy="138" r="4.5" fill="#ffffff"/>
          </g>
        </g>
        <g id="eyesSad" style="display:none">
          <g transform="translate(157 148) scale(1 .55) translate(-157 -148)">
            <circle cx="128" cy="142" r="13" fill="#26333f"/>
            <circle cx="186" cy="142" r="13" fill="#26333f"/>
            <circle cx="133" cy="138" r="4.5" fill="#ffffff"/>
            <circle cx="191" cy="138" r="4.5" fill="#ffffff"/>
          </g>
        </g>
        <g id="eyesSleepy" style="display:none">
          <path d="M116 145 L140 145" stroke="#26333f" stroke-width="4" stroke-linecap="round"/>
          <path d="M174 145 L198 145" stroke="#26333f" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="blushN">
          <ellipse cx="106" cy="168" rx="12" ry="7" fill="#ff9eb5" opacity=".75"/>
          <ellipse cx="210" cy="168" rx="12" ry="7" fill="#ff9eb5" opacity=".75"/>
        </g>
        <path id="mouthN" d="M148 176 Q160 188 172 176" stroke="#26333f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path id="mouthH" style="display:none" d="M144 172 Q160 196 176 172" stroke="#26333f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path id="mouthP" style="display:none" d="M151 181 Q160 174 169 181" stroke="#26333f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path id="mouthSad" style="display:none" d="M146 181 q7 -7 14 0 q7 7 14 0" stroke="#26333f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle id="mouthSleepy" style="display:none" cx="160" cy="181" r="6" fill="none" stroke="#26333f" stroke-width="3.5"/>
        <text id="zzz" x="228" y="82" font-size="18" fill="#e8f5ff" font-weight="bold" style="display:none">Zz…</text>
      </g>
      <circle class="hot" data-pool="touch_head" data-anim="wiggle" cx="160" cy="76" r="58" fill="transparent"/>
      <circle class="hot" data-pool="touch_belly" data-anim="squash" cx="160" cy="192" r="54" fill="transparent"/>
    </svg>
    <div id="hint">摸摸我的头和肚肚试试 · 按住 🎤 说话</div>
  </div>

  <div id="dock">
    <div id="chips">
      <button class="chipbtn util" data-repeat>🔁 再讲一个</button>
      <button class="chipbtn" data-say="生日快乐！">🎂 生日快乐！</button>
      <button class="chipbtn" data-say="唱首歌吧！">🎵 唱首歌！</button>
      <button class="chipbtn" data-say="给我讲个故事！">📖 讲故事！</button>
      <button class="chipbtn" data-say="你想吃白饭吗？">🍚 白饭！</button>
    </div>
    <div id="microw">
      <button id="hush" title="安静一下">🤫</button>
      <button id="mic" title="按住说话">🎤</button>
      <div id="inputrow">
        <input id="textbox" placeholder="在这里对小鲸灵说话…" autocomplete="off">
        <button id="send">发送</button>
      </div>
    </div>
  </div>

  <div id="drawerOverlay"></div>
  <div id="drawer">
    <div class="dhead"><h3>家长设置</h3><button id="drawerClose">✕</button></div>
    <label class="drow">音量
      <input type="range" id="vol" min="0" max="100" value="100">
      <span class="v" id="volVal">100</span>
    </label>
    <label class="drow">模式
      <select id="mode">
        <option value="child">儿童模式 · 冉冉姐姐</option>
        <option value="adult">大人模式 · 鱼片</option>
      </select>
    </label>
    <button id="clearMem" class="dbtn">🧹 清空小鲸灵的记忆</button>
    <h4>对话记录(最近)</h4>
    <div id="histList"><div class="muted">—</div></div>
  </div>

<script>
"use strict";
const THINKING = "让我想想……唔,让我再想亿会儿。";
let SESSION_ID = localStorage.getItem("wm_sid") || ("toy-" + new Date().toISOString().slice(0, 10));
const EGGS_URL = "/api/eggs";
let EGGS = { triggers: { touch_head: ["咕噜噜?"], touch_belly: ["咕噜噜!"], greeting: ["冉冉姐姐好!"], hush: ["好啦好啦……"], idle: ["冉冉姐姐,陪我玩嘛~"], fallback: ["咕噜噜……"] }, emo: {}, keyword_map: {} };
let curAudio = null, hideTimer = null, rec = null, listening = false, lastPool = "greeting";
let audioVolume = Number(localStorage.getItem("wm_vol") ?? "1");
if (Number.isNaN(audioVolume)) audioVolume = 1;
let chatMode = localStorage.getItem("wm_mode") || "child";

const $ = id => document.getElementById(id);
const speech = $("speech"), whaleG = $("whaleG"), chip = $("chip");

/* ---- 背景气泡 ---- */
for (let i = 0; i < 12; i++) {
  const b = document.createElement("div");
  const s = 8 + Math.random() * 26;
  b.className = "bubble";
  b.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;` +
    `animation-duration:${7 + Math.random() * 9}s;animation-delay:${-Math.random() * 12}s;`;
  document.body.appendChild(b);
}

/* ---- 粒子特效:生日彩带 / 摸头爱心 / 摸肚泡泡 ---- */
function spawnParticles(kind, x, y) {
  const conf = { confetti: ["🎊", "🎉", "🎂", "✨"], hearts: ["💙", "💗", "✨"], bubbles: ["🫧", "💧", "🫧"] }[kind];
  if (!conf) return;
  const n = kind === "confetti" ? 26 : 6;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "particle";
    s.textContent = conf[i % conf.length];
    s.style.left = (x + (Math.random() * 120 - 60)) + "px";
    s.style.top = (y - 10) + "px";
    s.style.setProperty("--dx", (Math.random() * 180 - 90) + "px");
    s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    s.style.animationDuration = (0.9 + Math.random() * 0.9) + "s";
    s.style.fontSize = (16 + Math.random() * 14) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}

/* ---- 气泡说话 ---- */
function bubble(text, ms = 6500) {
  speech.textContent = text;
  speech.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => speech.classList.remove("show"), ms);
}

/* ---- 播放与静音 ---- */
let muted = localStorage.getItem("wm_muted") === "1";
const muteBtn = $("mute");
function setMuted(m) {
  muted = m;
  localStorage.setItem("wm_muted", m ? "1" : "0");
  muteBtn.textContent = muted ? "🔇" : "🔊";
  if (m) stopAudioOnly();
}
muteBtn.addEventListener("click", () => setMuted(!muted));
setMuted(muted);

$("fs").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (_) {}
});

function stopAudioOnly() {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  try { speechSynthesis.cancel(); } catch (_) {}
}
function isPlaying() {
  return (curAudio && !curAudio.paused && !curAudio.ended) ||
    (window.speechSynthesis && speechSynthesis.speaking);
}

async function playUrl(url) {
  if (muted) return true;
  try {
    const r = await fetch(url);
    if (!r.ok) return false;
    const blob = await r.blob();
    stopAudioOnly();
    curAudio = new Audio(URL.createObjectURL(blob));
    curAudio.volume = audioVolume;
    await curAudio.play();
    return true;
  } catch (e) {
    if (e && e.name === "NotAllowedError") return true; // 未交互时自动播放被拦,气泡仍在
    return false;
  }
}

/* ---- TTS:edge-tts(情绪韵律)优先 → 浏览器合成兜底 ---- */
async function speak(text, emo) {
  if (muted) return;
  try {
    const q = new URLSearchParams({ text });
    if (emo) q.set("emo", emo);
    const r = await fetch("/api/tts?" + q.toString());
    if (!r.ok) throw new Error(r.status);
    const blob = await r.blob();
    stopAudioOnly();
    curAudio = new Audio(URL.createObjectURL(blob));
    await curAudio.play();
  } catch (e) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN"; u.rate = 1.05; u.volume = audioVolume;
      speechSynthesis.speak(u);
    } catch (_) { /* 静默:文字气泡仍在 */ }
  }
}

/* ---- 表情引擎(借鉴 Open-LLM-VTuber expression mapping,SVG 轻量版) ---- */
const EMO_PARTS = {
  normal: { eyes: "eyes", mouth: "mouthN" },
  happy:  { eyes: "eyesH", mouth: "mouthH" },
  shy:    { eyes: "eyes", mouth: "mouthSad", blush: "big" },
  pouty:  { eyes: "eyesP", mouth: "mouthP" },
  sad:    { eyes: "eyesSad", mouth: "mouthSad" },
  sleepy: { eyes: "eyesSleepy", mouth: "mouthSleepy", zzz: true },
};
const EMO_IDS = ["eyes", "eyesH", "eyesP", "eyesSad", "eyesSleepy",
  "mouthN", "mouthH", "mouthP", "mouthSad", "mouthSleepy"];

function setEmo(name) {
  const cfg = EMO_PARTS[name] || EMO_PARTS.normal;
  EMO_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.style.display = "none"; });
  const e = document.getElementById(cfg.eyes), m = document.getElementById(cfg.mouth);
  if (e) e.style.display = "";
  if (m) m.style.display = "";
  const blush = document.getElementById("blushN");
  if (blush) {
    blush.style.opacity = cfg.blush === "big" ? "1" : "";
    blush.style.transformBox = "fill-box";
    blush.style.transformOrigin = "center";
    blush.style.transform = cfg.blush === "big" ? "scale(1.3)" : "";
  }
  const z = document.getElementById("zzz");
  if (z) z.style.display = cfg.zzz ? "" : "none";
}

function animTrigger(anim) {
  if (!anim) return;
  whaleG.classList.remove(anim);
  void whaleG.getBoundingClientRect(); // 强制重排以重启动画
  whaleG.classList.add(anim);
  setTimeout(() => whaleG.classList.remove(anim), 800);
}

/* ---- 台词播放:本地选句 → 预生成音频(零延迟)→ edge-tts → 浏览器合成 ---- */
const pickIdx = pool => {
  const arr = EGGS.triggers[pool] || EGGS.triggers.fallback;
  const i = Math.floor(Math.random() * arr.length);
  return { text: arr[i], idx: i + 1 };
};

async function sayEgg(pool, anim, pre) {
  const p = pre || pickIdx(pool);
  lastPool = pool || lastPool;
  bubble(p.text);
  setEmo(EGGS.emo && (EGGS.emo[pool] || EGGS.emo.fallback));
  animTrigger(anim);
  if (await playUrl(`/egg-audio/${p.pool || pool}_${p.idx}.mp3`)) return;
  await speak(p.text, EGGS.emo && EGGS.emo[pool]);
}

/* ---- 发呆主动搭话(借鉴 MaiBot 主动消息;?idle=毫秒 可调,测试用) ---- */
const IDLE_MS = Math.max(4000, Number(new URLSearchParams(location.search).get("idle")) || 50000);
let idleTimer = null;
function poke() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (isPlaying()) { poke(); return; }
    sayEgg("idle", Math.random() < .5 ? "wiggle" : "squash");
    poke();
  }, IDLE_MS);
}

/* ---- 对话:DeepSeek(后端,多轮记忆)→ 离线兜底(直连预生成音频) ---- */
async function chat(text) {
  poke();
  bubble(THINKING, 8000);
  animTrigger("wiggle");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, session_id: SESSION_ID, mode: chatMode })
    });
    const data = await r.json();
    chip.textContent = data.source === "deepseek" ? "🧠 聪明模式" : "⚠️ 台词兜底";
    if (data.source === "offline" && data.pool && data.idx) {
      await sayEgg(data.pool, null, { text: data.reply, idx: data.idx, pool: data.pool });
    } else {
      lastPool = "fallback";
      bubble(data.reply);
      setEmo(data.emo);
      await speak(data.reply, data.emo);
    }
  } catch (e) {
    chip.textContent = "⚠️ 台词兜底";
    await sayEgg("fallback", null, null);
  }
}

/* ---- 触摸热区:永远是"要反应";连摸 5 次触发按摩机彩蛋(2.5s 内) ---- */
let tapCount = 0, tapTimer = null;
document.querySelectorAll(".hot").forEach(h => {
  h.addEventListener("pointerdown", e => {
    poke();
    spawnParticles(h.dataset.pool === "touch_head" ? "hearts" : "bubbles", e.clientX, e.clientY);
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 2500);
    if (tapCount >= 5) {
      tapCount = 0;
      sayEgg("touch_rapid", "squash");
      return;
    }
    sayEgg(h.dataset.pool, h.dataset.anim);
  });
});

/* ---- 快捷 chips ---- */
document.querySelectorAll(".chipbtn[data-say]").forEach(b => {
  b.addEventListener("click", () => chat(b.dataset.say));
});
document.querySelector("[data-repeat]").addEventListener("click", () => {
  poke();
  sayEgg(lastPool, null);
});

/* ---- 文字输入 ---- */
$("send").addEventListener("click", () => {
  const t = $("textbox").value.trim();
  if (t) { chat(t); $("textbox").value = ""; }
});
$("textbox").addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });

/* ---- 🤫 安静按钮:专属"停止"控制 ---- */
$("hush").addEventListener("pointerdown", () => {
  poke();
  stopAudioOnly();
  sayEgg("hush", null);
});

/* ---- 语音:按住说话(浏览器识别) ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  rec = new SR();
  rec.lang = "zh-CN"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => chat(e.results[0][0].transcript);
  rec.onend = () => setListen(false);
  rec.onerror = () => { setListen(false); bubble("呜……我听不清,冉冉姐姐用字字告诉我好不好?"); };
}
const micBtn = $("mic");
function setListen(on) {
  listening = on;
  micBtn.classList.toggle("rec", on);
  if (on) bubble("我在听……", 15000);
}
micBtn.addEventListener("pointerdown", () => {
  poke();
  if (!rec) { bubble("这台浏览器不能听声音,用下面的字字告诉我吧!"); return; }
  try { rec.start(); } catch (_) {}
});
["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
  micBtn.addEventListener(ev, () => { if (listening && rec) try { rec.stop(); } catch (_) {} }));

/* ---- 状态 chip + 生日横幅 ---- */
fetch("/api/health").then(r => r.json()).then(h => {
  chip.textContent = h.deepseek ? "🧠 聪明模式" : "💬 台词模式";
}).catch(() => {});
const isBirthday = new Date().getMonth() === 10 && new Date().getDate() === 27;
const force = location.search.includes("force");
if (isBirthday || force) {
  $("banner").style.display = "inline-block";
}

/* ---- 家长门:长按 ⚙ 2.5s 才进设置(孩子误触进不去) ---- */
const GATE_MS = 2500;
let gateTimer = null;
const settingsBtn = $("settings");
function gateTick() {
  const p = Math.min(1, (Date.now() - gateStart) / GATE_MS);
  settingsBtn.style.background = `linear-gradient(90deg,#ffd39e ${p * 100}%, rgba(255,255,255,.16) ${p * 100}%)`;
  if (p >= 1) { endGate(); openDrawer(); }
}
function endGate() { clearInterval(gateTimer); gateTimer = null; settingsBtn.style.background = ""; }
let gateStart = 0;
settingsBtn.addEventListener("pointerdown", e => {
  e.preventDefault();
  gateStart = Date.now();
  gateTimer = setInterval(gateTick, 40);
});
["pointerup", "pointerleave", "pointercancel"].forEach(ev => settingsBtn.addEventListener(ev, endGate));

/* ---- 设置抽屉 ---- */
function openDrawer() {
  $("drawer").classList.add("open");
  $("drawerOverlay").classList.add("show");
  loadHistory();
}
function closeDrawer() {
  $("drawer").classList.remove("open");
  $("drawerOverlay").classList.remove("show");
}
$("drawerClose").addEventListener("click", closeDrawer);
$("drawerOverlay").addEventListener("click", closeDrawer);

/* 音量 */
const volSlider = $("vol");
volSlider.value = Math.round(audioVolume * 100);
$("volVal").textContent = Math.round(audioVolume * 100);
volSlider.addEventListener("input", () => {
  audioVolume = volSlider.value / 100;
  localStorage.setItem("wm_vol", String(audioVolume));
  $("volVal").textContent = volSlider.value;
  if (curAudio) curAudio.volume = audioVolume;
});

/* 模式:儿童(冉冉姐姐)/ 大人(鱼片) */
const modeSel = $("mode");
modeSel.value = chatMode;
modeSel.addEventListener("change", () => {
  chatMode = modeSel.value;
  localStorage.setItem("wm_mode", chatMode);
  stopAudioOnly();
  speak(chatMode === "adult" ? "(傲娇)哼,鱼片,想聊什么?" : "(开心)冉冉姐姐回来啦!继续陪我玩!",
    chatMode === "adult" ? "pouty" : "happy");
});

/* 清空记忆 */
$("clearMem").addEventListener("click", () => {
  SESSION_ID = "toy-" + Date.now();
  localStorage.setItem("wm_sid", SESSION_ID);
  closeDrawer();
  stopAudioOnly();
  bubble("记忆清空啦!重新认识一下,我是小鲸灵!", 5000);
});

/* 对话记录(本地 chat_log 只读) */
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
async function loadHistory() {
  const list = $("histList");
  list.innerHTML = '<div class="muted">加载中…</div>';
  try {
    const r = await fetch("/api/history?limit=60");
    const { items } = await r.json();
    if (!items.length) { list.innerHTML = '<div class="muted">还没有对话记录</div>'; return; }
    list.innerHTML = items.slice().reverse().map(it =>
      `<div class="histItem"><div class="t">${esc(it.ts)} · ${it.source === "deepseek" ? "🧠" : "💬"}</div>` +
      `<div>🧒 ${esc(it.user)}</div><div>🐋 ${esc(it.whale)}</div></div>`).join("");
  } catch (_) { list.innerHTML = '<div class="muted">加载失败</div>'; }
}

/* ---- 屏幕常亮(生日演示时平板不休眠;浏览器不支持则静默) ---- */
let wakeLock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (_) {}
}
document.addEventListener("pointerdown", keepAwake);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

/* ---- 启动 ---- */
fetch(EGGS_URL).then(r => r.json()).then(j => { EGGS = j; }).catch(() => {});
setTimeout(() => {
  const startPool = isBirthday || force ? "birthday" : "greeting";
  if (isBirthday || force) spawnParticles("confetti", innerWidth / 2, 130);
  sayEgg(startPool, null);
  poke();
}, 900);
</script>
</body>
</html>
